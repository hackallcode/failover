name: release

on:
  push:
    tags: ["v*"]

jobs:
  litestream:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build litestream for amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch --output type=local,dest=out/$arch litestream
            mv out/$arch/litestream litestream-linux-$arch
          done
          sha256sum litestream-linux-* > litestream.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            litestream-linux-*
            litestream.sha256
