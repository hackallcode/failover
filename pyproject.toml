[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "failover"
version = "0.1.0"
description = "Failover of single-writer services over NATS JetStream: one leader per service, its SQLite databases replicated as snapshots in a KV bucket."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["nats-py==2.16.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[project.scripts]
failover = "failover.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
